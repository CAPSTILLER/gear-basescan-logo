<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GEAR BaseScan logos</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    a { color: #3b82f6; }
    code { background: #1a1a1a; padding: 0.15rem 0.35rem; border-radius: 4px; }
    img { image-rendering: pixelated; background: #000; border: 1px solid #333; margin: 0.5rem 0; }
  
    .gear-home-cutout {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      z-index: 40; display: inline-flex; opacity: 0.9; transition: opacity .15s ease; line-height: 0;
    }
    .gear-home-cutout:hover, .gear-home-cutout:focus-visible { opacity: 1; }
    .gear-home-cutout:active { opacity: 0.7; }
    .gear-home-cutout img { height: 56px; width: auto; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
  <h1>GEAR BaseScan logos</h1>
  <p>Public files for BaseScan token update.</p>
  <ul>
    <li><a href="/gear-logo-32x32.svg">gear-logo-32x32.svg</a> (SVG 32×32 wrapper)</li>
    <li><a href="/gear-logo-64x64.png">gear-logo-64x64.png</a> (PNG 64×64)</li>
  </ul>
  <p>Preview:</p>
  <img src="/gear-logo-32x32.svg" width="256" height="256" alt="GEAR SVG" />

  <a class="gear-home-cutout" href="https://landonthis.gearup.wtf" target="_blank" rel="noopener noreferrer" aria-label="Gear home — landonthis">
    <img src="/gear-logo-cutout.svg" alt="" height="56" width="213" />
  </a>
</body>
</html>
